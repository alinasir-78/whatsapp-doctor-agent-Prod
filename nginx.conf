# Nginx Production Reverse Proxy Configuration for WhatsApp Doctor Agent
# Place in /etc/nginx/sites-available/doctor-agent and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-clinic-domain.com www.your-clinic-domain.com;

    # Redirect all HTTP traffic to HTTPS (Certbot will configure this automatically)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name your-clinic-domain.com www.your-clinic-domain.com;

    # SSL Certificate paths (managed by Certbot / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/your-clinic-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-clinic-domain.com/privkey.pem;

    # Optimized SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Max upload size (for patient Excel import)
    client_max_body_size 15M;

    # Reverse Proxy to Node.js App
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Forward headers for Express trust proxy & secure cookies
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Meta Webhooks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_cache_bypass $http_upgrade;
    }

    # Health check bypass
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
